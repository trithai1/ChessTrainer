<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <nav class="nav-header">
        <div class="header-left">
            <a href="index.html">Board</a> |
            <a href="about.html">About</a>
        </div>
    </nav>
    <main class="game">
        <div id="chess-container">
            <div id="chess-border">
                <div id="chess-grid">
                    <div id="promotion-overlay">
                        <div id="promotion-q">
                            <div class="wq promotion-piece"></div>
                        </div>
                        <div id="promotion-n">
                            <div class="wn promotion-piece"></div>
                        </div>
                        <div id="promotion-r">
                            <div class="wr promotion-piece"></div>
                        </div>
                        <div id="promotion-b">
                            <div class="wb promotion-piece"></div>
                        </div>
                    </div>
                    <svg id="svg-container" viewBox="0 0 80 80"></svg>
                </div>
            </div>
        </div>
        <div id="side-panel">
            <div class="rating-container">
                <p>Ratings</p>
                <div class="ratings">
                    <div class="puzzle rating">
                        <span class="label">Puzzle</span>
                        <span class="value">1000</span>
                    </div>
                    <div class="position rating">
                        <span class="label">Position</span>
                        <span class="value">1000</span>
                    </div>
                </div>
            </div>
            <div class="move-classification">
                <p>...</p>
            </div>
            <button class="next-challenge" disabled>Inprogress...</button>
        </div>
    </main>
    <footer class="footer">
        <p>© 2026 Quangtri Thai. All Rights Reserved. | <a href="/privacy">Privacy Policy</a> | <span>Some illustrative site assets are AI-generated.</span></p>
    </footer>
    <script type="module" src="./scripts.js"></script>
</body>
</html>
